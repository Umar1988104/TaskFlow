<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TaskFlow</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--txt:#000;--sub:#8e8e93;--sep:rgba(60,60,67,.18);--blue:#007aff;--red:#ff3b30;--bar:rgba(249,249,249,.85)}
:root{--tabh:56px;--glass:#fff;--glass-b:transparent;--glass-s:none}
:root[data-theme=dark]{--bg:#06070b;--card:#14161d;--txt:#f5f6fa;--sep:rgba(120,125,150,.28);--bar:rgba(14,15,22,.82);--glass:rgba(255,255,255,.06);--glass-b:rgba(255,255,255,.12);--glass-s:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.28)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"SF Pro Text","Inter",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.9)}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(210px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:4;margin:0 -16px;padding:calc(max(env(safe-area-inset-top,0px),28px) + 28px) 20px 8px;border-bottom:.5px solid transparent;transition:padding .25s ease,background .25s,border-color .25s}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;transition:font-size .25s ease}
.count{color:var(--sub);font-size:15px;margin-top:2px}
h2{font-size:13px;font-weight:600;color:var(--sub);margin:22px 16px 6px}
h2.od{color:var(--red)}
.group{background:var(--glass);border:.5px solid var(--glass-b);border-radius:16px;overflow:hidden;box-shadow:var(--glass-s);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.row{position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:max-height .3s ease,opacity .25s,transform .28s}
.row+.row::before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:var(--sep)}
.row.enter{animation:pop .42s cubic-bezier(.2,.9,.3,1.15)}
.row.leave{opacity:0;transform:translateX(-26px)}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);position:relative;transition:background .25s,border-color .25s,transform .15s}
.chk::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.chk.on{background:var(--blue);border-color:var(--blue)}
.chk.on::after{transform:rotate(45deg) scale(1)}
.body{flex:1;min-width:0;padding:10px 0}
.title{font-size:17px;line-height:1.25;overflow-wrap:anywhere;transition:color .25s}
.row.done .title{color:var(--sub);text-decoration:line-through}
.meta{font-size:13px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{font-weight:600;color:var(--c);display:inline-flex;align-items:center;gap:5px}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.del{flex:none;width:34px;height:34px;border-radius:50%;color:var(--sub);display:grid;place-items:center}
.empty{text-align:center;color:var(--sub);margin-top:90px;padding:0 24px;line-height:1.5}
.empty b{display:block;font-size:20px;color:var(--txt);margin-bottom:6px}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:8px 16px 10px}
.dock-in{max-width:520px;margin:0 auto}
#prev{min-height:26px;font-size:13px;color:var(--sub);padding:0 6px 6px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
#prev.show{opacity:1;transform:none}
#prev b{color:var(--txt);font-weight:600}
.field{display:flex;gap:8px;align-items:center}
#in{flex:1;font:inherit;font-size:17px;color:var(--txt);background:var(--card);border:.5px solid var(--sep);border-radius:22px;padding:10px 16px;outline:none;transition:box-shadow .2s}
#in:focus{box-shadow:0 0 0 3px rgba(0,122,255,.25)}
#add{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center}
header{display:flex;justify-content:space-between;align-items:flex-end}
.bell{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--blue);display:grid;place-items:center;margin-bottom:6px}
.bell.off{color:var(--sub)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:14px 14px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:520px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
.sheet h3{font-size:17px;margin-bottom:2px}
.sm{color:var(--sub);font-size:13px}
.sheet h4{font-size:13px;color:var(--sub);font-weight:600;margin:14px 6px 6px}
.opts{border-radius:12px;overflow:hidden}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 14px;background:var(--card);font-size:17px;text-align:left}
.opt+.opt{border-top:.5px solid var(--sep)}
.opt .tick{color:var(--blue);opacity:0;transition:opacity .2s}
.opt.on .tick{opacity:1}
.banner{position:fixed;top:calc(max(env(safe-area-inset-top,0px),32px) + 8px);left:12px;right:12px;max-width:496px;margin:0 auto;z-index:30;background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.22);padding:12px 14px;transform:translateY(-250%);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.3,1),opacity .3s,visibility .4s}
.banner.show{transform:none;opacity:1;visibility:visible}
.banner b{display:block;font-size:15px}
.banner span{font-size:14px;color:var(--sub)}
.acts{display:flex;gap:18px;margin-top:8px}
.acts button{color:var(--blue);font-size:15px;font-weight:600}
.row+.row::before{z-index:1}
.in{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:60px;background:transparent;position:relative;transform:translateX(var(--dx,0px));transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.row.drag .in{transition:none}
.row[data-sw=r]{background:#34c759}.row[data-sw=l]{background:var(--red)}
.row[data-sw]::after{content:attr(data-lbl);position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-weight:600;font-size:15px}
.row[data-sw=r]::after{left:18px}.row[data-sw=l]::after{right:18px}
.when.od{color:var(--red);font-weight:600}.when.soon{color:#ff9500;font-weight:600}
.meta a{color:var(--blue);text-decoration:none;font-weight:600}
.sheet{max-height:88vh;overflow-y:auto}
#sub-in{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--txt);background:var(--card);border:.5px solid var(--sep);border-radius:22px;padding:10px 16px;outline:none}
.hb{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--glass);border:.5px solid var(--glass-b);box-shadow:var(--glass-s);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:700}
.stat span{font-size:12px;color:var(--sub)}
.bars{display:flex;gap:6px;align-items:flex-end;height:72px;margin-top:12px;background:var(--glass);border:.5px solid var(--glass-b);box-shadow:var(--glass-s);border-radius:16px;padding:10px 12px 22px;position:relative}
.bars div{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}
.bars i{width:100%;background:var(--blue);border-radius:4px 4px 2px 2px;min-height:3px;transition:height .5s cubic-bezier(.2,.9,.3,1)}
.bars em{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--sub)}
.days{display:flex;gap:6px}
.days button{flex:1;padding:11px 0;border-radius:10px;background:var(--card);font-weight:600;font-size:14px;color:var(--txt);transition:background .2s,color .2s,transform .15s}
.days button.on{background:var(--blue);color:#fff}
body{transition:background .3s,color .3s}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:11px;font-weight:500;transition:color .2s}
.tabs button.on{color:var(--blue)}
.tabs svg{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tabs button.on svg{transform:translateY(-1px) scale(1.12)}
body[data-tab=progress] .dock,body[data-tab=settings] .dock{display:none}
.kb .tabs{display:none}.kb .dock{bottom:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;min-height:50px;font-size:17px;width:100%;text-align:left}
.srow+.srow{border-top:.5px solid var(--sep)}
.srow.col{flex-direction:column;align-items:stretch;gap:10px}
.srow.btn{color:var(--blue)}.srow.danger{color:var(--red)}
label.srow{cursor:pointer}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.32);transition:background .25s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i::after{transform:translateX(20px)}
.seg{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--txt);transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg.multi button.on{background:var(--blue);color:#fff;box-shadow:none}
.dots{display:flex;gap:14px}
.dots button{width:30px;height:30px;border-radius:50%;background:var(--c);outline:2px solid transparent;outline-offset:3px;transition:outline-color .2s}
.dots button.on{outline-color:var(--c)}
.tin{font:inherit;font-size:17px;color:var(--txt);background:transparent;border:0;text-align:right;outline:none;width:55%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s;will-change:transform;animation:drift 26s ease-in-out infinite alternate;background:radial-gradient(40% 34% at 18% 14%,color-mix(in srgb,var(--blue) 34%,transparent),transparent 72%),radial-gradient(34% 30% at 86% 32%,rgba(175,82,222,.24),transparent 72%),radial-gradient(40% 34% at 50% 92%,rgba(48,176,199,.2),transparent 72%)}
:root[data-theme=dark] body::before{opacity:1}
.noglow::before{display:none}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
.scrolled header{padding-top:calc(max(env(safe-area-inset-top,0px),28px) + 8px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.scrolled h1{font-size:20px}.scrolled .count{display:none}
.row.drag .in,.row.leave .in{background:var(--card)}
.in::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c,transparent)}
.row.done .in::before{background:var(--sub)}
.tm{flex:none;text-align:right;min-width:46px;line-height:1.15;font-variant-numeric:tabular-nums}
.tm b{display:block;font-size:17px;font-weight:600}
.tm span{font-size:11px;font-weight:600;color:var(--sub)}
.tm small{display:block;font-size:11px;color:var(--sub);white-space:nowrap}
.tm.od b{color:var(--red)}.tm.soon b{color:#ff9500}
.stag .row{animation:rise .55s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.glass{background:var(--glass);border:.5px solid var(--glass-b);border-radius:18px;box-shadow:var(--glass-s);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.dash{display:grid;gap:10px;margin:4px 0 2px}
.ringcard{display:flex;align-items:center;gap:16px;padding:14px 16px}
.ringcard b{display:block;font-size:22px;font-weight:700}
.ringcard span{color:var(--sub);font-size:14px}
#ring{flex:none;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--sep);stroke-width:6}
.rp{fill:none;stroke:var(--blue);stroke-width:6;stroke-linecap:round;stroke-dasharray:169.6;stroke-dashoffset:169.6;transition:stroke-dashoffset .9s cubic-bezier(.2,.9,.3,1)}
.nextcard{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;width:100%;color:var(--txt)}
.nico{position:relative;flex:none;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--c,var(--blue)) 20%,transparent);color:var(--c,var(--blue));display:grid;place-items:center}
.nico.pulse::after{content:"";position:absolute;inset:-4px;border-radius:17px;border:2px solid var(--c);animation:pulse 1.8s ease-out infinite}
.nico.pulse.fast::after{animation-duration:.9s}
@keyframes pulse{from{transform:scale(.92);opacity:.7}to{transform:scale(1.3);opacity:0}}
.nbody{flex:1;min-width:0}
.nbody small{display:block;font-size:12px;font-weight:600;color:var(--blue)}
.nbody b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbody span{font-size:13px;color:var(--sub)}
.ncount{text-align:right;font-variant-numeric:tabular-nums}
.ncount b{display:block;font-size:20px;font-weight:700}
.ncount span{font-size:11px;color:var(--sub)}
.spark{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50;animation:spark .9s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#prev{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
#qs{display:none;gap:8px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
#qs::-webkit-scrollbar{display:none}
.kb #qs{display:flex}
#qs button{flex:none;padding:6px 12px;border-radius:999px;background:var(--glass);border:.5px solid var(--glass-b);font-size:13px;font-weight:500;color:var(--blue)}
#web{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.pri{font-weight:600;font-size:12px;padding:1px 8px;border-radius:999px}
.pri.high{background:rgba(255,59,48,.16);color:var(--red)}.pri.med{background:rgba(255,149,0,.16);color:#ff9500}.pri.low{background:rgba(0,122,255,.14);color:var(--blue)}
.tg{color:var(--sub);font-weight:500}
#flt{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
#flt::-webkit-scrollbar{display:none}
#flt button{flex:none;padding:6px 13px;border-radius:999px;background:var(--glass);border:.5px solid var(--glass-b);font-size:13px;font-weight:500;color:var(--txt);transition:background .2s,color .2s}
#flt button.on{background:var(--blue);color:#fff;border-color:transparent}
.chipbtn{flex:none;padding:6px 16px;border-radius:999px;background:var(--glass);border:.5px solid var(--glass-b);color:var(--blue);font-weight:600;font-size:15px}
.opts .srow{background:var(--card)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 30%}
.pbtn{width:100%;padding:14px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;margin-top:18px}
.tbtn{width:100%;padding:12px;color:var(--sub);font-size:16px}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hist em{font-style:normal;text-align:center;font-size:11px;color:var(--sub)}
.hist i{aspect-ratio:1;border-radius:7px;background:var(--glass);border:.5px solid var(--glass-b)}
.hist i.d{background:var(--blue);border-color:transparent}
.hist i.m{background:rgba(255,59,48,.24)}
.hist i.n{opacity:.4}
.hist i.t{outline:2px solid var(--blue);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="web"></canvas>
<div id="app">
  <header><div><h1 id="ttl">Today</h1><div class="count" id="count"></div></div><div class="hb"><button class="bell" id="bell" aria-label="Enable reminders"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg></button></div></header>
  <section id="dash" class="dash">
    <div class="glass ringcard"><svg id="ring" viewBox="0 0 64 64" width="64" height="64"><circle class="rt" cx="32" cy="32" r="27"/><circle class="rp" id="rp" cx="32" cy="32" r="27"/></svg><div><b id="rn">0 of 0</b><span id="rs"></span></div></div>
    <button class="glass nextcard" id="next" hidden><div class="nico" id="nico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="nbody"><small id="nlab">Next up</small><b id="nt"></b><span id="nm"></span></div><div class="ncount" id="nc"></div></button>
  </section>
  <div id="flt"></div>
  <main id="list"></main>
  <section id="progress" hidden></section>
  <section id="settings" hidden></section>
</div>
<div class="dock"><div class="dock-in">
  <div id="qs"><button data-w="today">Today</button><button data-w="tomorrow">Tomorrow</button><button data-w="daily">Daily</button><button data-w="weekdays">Weekdays</button><button data-w="!high">High priority</button><button data-w="contest">Contest</button><button data-w="homework">Homework</button><button data-w="exam">Exam</button><button data-w="at 7pm">7 pm</button></div>
  <div id="prev"></div>
  <div class="field">
    <input id="in" type="text" placeholder="tomorrow 7:30-10:30 contest on Codeforces" enterkeyhint="done" autocomplete="off">
    <button id="add" aria-label="Add task">+</button>
  </div>
</div></div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div style="min-width:0"><h3 id="sh-t"></h3><div class="sm" id="sh-s"></div></div><button class="chipbtn" id="sh-edit">Edit</button></div>
  <h4>Remind me</h4><div class="opts" id="sh-r"></div>
  <h4>Snooze</h4><div class="opts" id="sh-sn"><button class="opt" data-m="10">In 10 minutes</button><button class="opt" data-m="60">In 1 hour</button><button class="opt" data-m="tm">Tomorrow, 9:00 AM</button></div>
  <h4>Repeat on</h4><div class="days" id="sh-days"></div>
  <div class="acts" style="margin:10px 6px 0"><button data-p="all">Every day</button><button data-p="wk">Weekdays</button><button data-p="no">Don't repeat</button></div>
  <div class="sm" id="sh-rt" style="margin:8px 6px 0"></div>
  <h4>Steps</h4><div class="opts" id="sh-sub"></div>
  <div class="field" style="margin-top:8px"><input id="sub-in" type="text" placeholder="Add a step" autocomplete="off"><button class="bell" id="sub-add" aria-label="Add step" style="margin:0;font-size:24px">+</button></div>
  <h4 id="sh-histh">History</h4><div id="sh-hist"></div>
  <div class="opts" style="margin-top:18px"><button class="opt" id="sh-del" style="color:var(--red)">Delete task</button></div>
</div>
<div class="sheet" id="edit"><div class="grab"></div><h3>Edit task</h3>
  <div class="opts" style="margin-top:8px">
    <div class="srow"><span>Title</span><input class="tin" id="e-title" maxlength="120" placeholder="Task title"></div>
    <div class="srow"><span>Date</span><input class="tin" id="e-date" type="date"></div>
    <div class="srow"><span>Start</span><input class="tin" id="e-st" type="time"></div>
    <div class="srow"><span>End</span><input class="tin" id="e-en" type="time"></div>
  </div>
  <h4>Category</h4><div class="seg wrap" id="e-cat"></div>
  <h4>Priority</h4><div class="seg" id="e-pri"></div>
  <h4>Tags</h4><div class="opts"><div class="srow"><input class="tin" id="e-tags" placeholder="dsa, college" style="width:100%;text-align:left"></div></div>
  <button class="pbtn" id="e-save">Save changes</button><button class="tbtn" id="e-cancel">Cancel</button>
</div>
<div class="banner" id="banner"><b id="bn-t"></b><span id="bn-s"></span><div class="acts"><button id="bn-sn">Snooze 10 min</button><button id="bn-x">Dismiss</button></div></div>

<nav class="tabs">
  <button data-tab="today" class="on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3M16 2v3M3 9h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg><span>Today</span></button>
  <button data-tab="upcoming"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Upcoming</span></button>
  <button data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V11M12 20V4M18 20v-6"/></svg><span>Progress</span></button>
  <button data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
</nav>

<script>
/* ---------- storage (offline, on device) ---------- */
const KEY='taskflow.v1';
const Store={
  load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}},
  save(t){try{localStorage.setItem(KEY,JSON.stringify(t))}catch(e){}setTimeout(sync,0)}
};
const SKEY='taskflow.settings';
const DEF={theme:'auto',accent:'#007aff',anim:true,haptics:true,rem:[60,10],snooze:10,name:'',h24:false,ampm:'contest',showDone:true,aurora:true,web:true,lite:(navigator.hardwareConcurrency||8)<=4,tags:true,morning:true,morningTime:'07:30',autoBackup:'weekly',lastBackup:'',lastBackupErr:''};
let S=(()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(SKEY))||{})}catch(e){return Object.assign({},DEF)}})();
const saveS=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};
function applyTheme(){
  const dark=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.setProperty('--blue',S.accent);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#06070b':'#f2f2f7';
  document.body.classList.toggle('noanim',!S.anim);document.body.classList.toggle('noglow',!S.aurora);window.__webApply&&window.__webApply();
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
applyTheme();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const DOW=['sun','mon','tue','wed','thu','fri','sat'];
const COLORS={Contest:'#af52de',Homework:'#007aff',Assignment:'#ff9500',Exam:'#ff3b30',Task:'#8e8e93'};

/* ---------- natural-language parser ---------- */
function parse(text){
  let s=' '+text+' ';
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const cut=re=>{const m=s.match(re);if(m)s=s.replace(re,' ');return m};
  const cat=/contest|codeforces|leetcode|codechef|atcoder|hackathon/i.test(s)?'Contest'
    :/homework|\bhw\b/i.test(s)?'Homework'
    :/assignment|submission|submit|project/i.test(s)?'Assignment'
    :/exam|quiz|viva|\btest\b/i.test(s)?'Exam':'Task';
  // time: no am/pm -> 1-6 means PM; 7-11 means PM only for contests
  const conv=(h,m,mer)=>{h=+h;m=+(m||0);
    if(mer){mer=mer.toLowerCase();if(mer==='pm'&&h<12)h+=12;if(mer==='am'&&h===12)h=0}
    else if(h>=1&&h<=6)h+=12;else if(h>=7&&h<=11&&(S.ampm==='pm'||(S.ampm==='contest'&&cat==='Contest')))h+=12;
    return pad(h)+':'+pad(m)};
  let st=null,en=null,m;
  const lk=cut(/\s((?:https?:\/\/|www\.)\S+)/i);let link=lk?lk[1].replace(/[.,;)]+$/,''):null;
  if(link&&!/^https?:/i.test(link))link='https://'+link;
  let pri=null;const tags=[];
  if(m=cut(/\s!(high|medium|med|low|h|m|l)(?=[\s,.]|$)/i))pri={h:'high',m:'med',l:'low'}[m[1][0].toLowerCase()];
  else if(m=cut(/\s(high|medium|low)\s+priority(?=[\s,.]|$)/i))pri={h:'high',m:'med',l:'low'}[m[1][0].toLowerCase()];
  for(let k=0;k<6&&(m=cut(/\s#([a-z0-9_-]+)(?=[\s,.]|$)/i));k++)tags.push(m[1].toLowerCase());
  if(m=cut(/\s(?:from\s+|at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|till|until)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?(?=[\s,.])/i)){
    const mer=m[3]||m[6];st=conv(m[1],m[2],mer);en=conv(m[4],m[5],m[6]||m[3]);
  }else if(m=cut(/\s(?:at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=[\s,.])/i)){st=conv(m[1],m[2],m[3])}
  else if(m=cut(/\s(?:at\s+|@\s*)?(\d{1,2}):(\d{2})(?=[\s,.])/i)){st=conv(m[1],m[2])}
  else if(m=cut(/\sat\s+(\d{1,2})(?=[\s,.])/i)){st=conv(m[1])}
  // date + repeat
  let d=null,rp=null,dys=null;
  const WD='(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)';
  const dl=x=>[...new Set((x.match(new RegExp(WD,'gi'))||[]).map(w=>DOW.indexOf(w.slice(0,3).toLowerCase())))].sort();
  const LST='((?:'+WD+'(?:\\s*(?:,|and|&)?\\s*))+)';
  if(m=cut(new RegExp('\\s(?:every\\s*day|daily)\\s+(?:except|but not|excluding|other than)\\s+'+LST+'(?=[\\s,.]|$)','i'))){
    const ex=dl(m[1]);dys=[0,1,2,3,4,5,6].filter(x=>!ex.includes(x));rp='days';
  }else if(cut(/\s(?:every\s+weekday|weekdays)(?=[\s,.])/i)){dys=[1,2,3,4,5];rp='days'}
  else if(cut(/\s(?:every\s+weekend|weekends)(?=[\s,.])/i)){dys=[0,6];rp='days'}
  else if((m=s.match(new RegExp('\\severy\\s+'+LST+'(?=[\\s,.]|$)','i')))&&dl(m[1]).length>1){s=s.replace(m[0],' ');dys=dl(m[1]);rp='days'}
  else if(m=cut(/\severy\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)(?=[\s,.])/i)){
    rp='weekly';d=addDays(today,(DOW.indexOf(m[1].slice(0,3).toLowerCase())-today.getDay()+7)%7);
  }else if(cut(/\s(?:every\s*day|daily)(?=[\s,.])/i))rp='daily';
  else if(cut(/\s(?:every\s+week|weekly)(?=[\s,.])/i))rp='weekly';
  const mk=(dd,mm,yy)=>{let y=yy?(+yy<100?2000+ +yy:+yy):today.getFullYear();let x=new Date(y,mm,+dd);if(!yy&&x<today)x=new Date(y+1,mm,+dd);return x};
  if(d){}else if(cut(/\sday after\s+(?:to+m+o+r+o+w|tmrw)(?=[\s,.])/i))d=addDays(today,2);
  else if(cut(/\s(?:to+m+o+r+o+w|tmrw|tmr)(?=[\s,.])/i))d=addDays(today,1);
  else if(cut(/\s(?:today|tonight)(?=[\s,.])/i))d=today;
  else if(m=cut(/\sin\s+(\d+)\s+days?(?=[\s,.])/i))d=addDays(today,+m[1]);
  else if(m=cut(/\s(?:(next|this|on)\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)(?=[\s,.])/i)){
    let diff=(DOW.indexOf(m[2].slice(0,3).toLowerCase())-today.getDay()+7)%7;
    if(diff===0&&m[1]&&m[1].toLowerCase()==='next')diff=7;d=addDays(today,diff);
  }else if(m=cut(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=[\s,.])/))d=mk(m[1],m[2]-1,m[3]);
  else if(m=cut(/\s(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?=[\s,.])/i))d=mk(m[1],MON.indexOf(m[2].toLowerCase()));
  else if(m=cut(/\s(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?(?=[\s,.])/i))d=mk(m[2],MON.indexOf(m[1].toLowerCase()));
  const nowT=pad(now.getHours())+':'+pad(now.getMinutes());
  if(!d){d=today;if(st&&st<nowT)d=addDays(today,rp==='weekly'?7:1)}
  else if(rp==='weekly'&&st&&ymd(d)===ymd(today)&&st<nowT)d=addDays(d,7);
  if(rp==='days'){let g=0;while(g++<8&&(!dys.includes(d.getDay())||(ymd(d)===ymd(today)&&st&&st<nowT)))d=addDays(d,1)}
  // title
  let title=s.replace(/\s+/g,' ').trim()
    .replace(/^(?:(?:at|on|from|by|due|the|-|,)\s+)+/i,'').replace(/(?:\s+(?:at|on|from|by|due|-|,))+$/i,'').trim();
  title=title?title[0].toUpperCase()+title.slice(1):cat;
  return{title,category:cat,date:ymd(d),start:st,end:en,repeat:rp,days:dys,link,pri,tags};
}

/* ---------- formatting ---------- */
const t12=t=>{let[h,m]=t.split(':').map(Number);if(S.h24)return pad(h)+':'+pad(m);const p=h>=12?'PM':'AM';return(h%12||12)+':'+pad(m)+' '+p};
function timeTxt(t){if(!t.start)return'Any time';const a=t12(t.start);if(!t.end)return a;const b=t12(t.end);return(!S.h24&&a.slice(-2)===b.slice(-2)?a.slice(0,-3):a)+' – '+b}
function dateTxt(ds){const today=ymd(new Date());if(ds===today)return'Today';if(ds===ymd(addDays(new Date(),1)))return'Tomorrow';
  return new Date(ds+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
const endAt=t=>new Date(t.date+'T'+(t.end||t.start||'23:59')+':00');
function group(t){if(t.done)return'Completed';if(endAt(t)<new Date())return'Overdue';
  if(t.date===ymd(new Date()))return'Today';if(t.date===ymd(addDays(new Date(),1)))return'Tomorrow';return'Upcoming'}

/* ---------- UI ---------- */
let tasks=Store.load(),newId=null;
const list=$('#list'),inp=$('#in'),prev=$('#prev');
const TRASH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';

const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function repTxt(t){
  if(t.repeat==='daily')return'Daily';if(t.repeat==='weekly')return'Weekly';
  const d=t.days||[];if(d.length===7)return'Daily';if(d.join()==='1,2,3,4,5')return'Weekdays';if(d.join()==='0,6')return'Weekends';
  if(d.length>=5)return'Daily except '+[0,1,2,3,4,5,6].filter(x=>!d.includes(x)).map(x=>DOWN[x]).join(', ');
  return d.map(x=>DOWN[x]).join(' ');
}
const effDays=t=>t.repeat==='daily'?[0,1,2,3,4,5,6]:t.repeat==='weekly'?[new Date(t.date+'T00:00:00').getDay()]:t.repeat==='days'?(t.days||[]):[];
const tp=t=>{const[h,m]=t.split(':').map(Number);return S.h24?[pad(h)+':'+pad(m),'']:[(h%12||12)+':'+pad(m),h>=12?'PM':'AM']};
function urg(t){
  if(t.done)return'';const now=Date.now();if(endAt(t).getTime()<now)return'od';
  if(!t.start)return t.date===ymd(new Date())?'soon':'';
  return baseAt(t)-now<3*36e5?'soon':'';
}
function render(){
  drawDash();drawFlt();
  const order=tab==='upcoming'?['Tomorrow','Upcoming']:['Overdue','Today'].concat(S.showDone?['Completed']:[]),g={};
  tasks.filter(passF).sort((a,b)=>{const x=a.date+(a.start||'99:99'),y=b.date+(b.start||'99:99');return x<y?-1:x>y?1:(PR[a.pri]??3)-(PR[b.pri]??3)})
    .forEach(t=>(g[group(t)]=g[group(t)]||[]).push(t));
  let ri=0;
  $('#count').textContent=subtitle();
  if(!order.some(k=>g[k])){list.innerHTML=flt.t!=='all'?'<div class="empty"><b>No matches</b>Try another filter.</div>':!tasks.length?'<div class="empty"><b>Nothing planned</b>Type a task below, like “tomorrow 7:30-10:30 contest on Codeforces”.</div>':tab==='upcoming'?'<div class="empty"><b>Nothing coming up</b>Tasks for later days will show here.</div>':'<div class="empty"><b>All clear today</b>Enjoy it, or add something below.</div>';return}
  list.innerHTML=order.filter(k=>g[k]).map(k=>`<h2 class="${k==='Overdue'?'od':''}">${k}</h2><div class="group">`+
    g[k].map(t=>{const sb=t.subs||[],dn=sb.filter(x=>x.d).length,u=urg(t);
      return `<div class="row${t.done?' done':''}${t.id===newId?' enter':''}" data-id="${t.id}" style="--i:${ri++};--c:${COLORS[t.category]}"><div class="in">
      <button class="chk${t.done?' on':''}" aria-label="Toggle done"></button>
      <div class="body"><div class="title">${esc(t.title)}</div>
        <div class="meta"><span class="tag" style="--c:${COLORS[t.category]}">${t.category}</span>${S.tags&&t.pri?`<span class="pri ${t.pri}">${PRL[t.pri]}</span>`:''}${k==='Today'?'':`<span class="when ${u}">${dateTxt(t.date)}</span>`}${t.repeat?`<span>↻ ${repTxt(t)}</span>`:''}${sb.length?`<span>${dn}/${sb.length} steps</span>`:''}${!t.done&&t.rem&&t.rem.length?`<span>🔔 ${t.rem.length}</span>`:''}${S.tags?(t.tags||[]).map(x=>`<span class="tg">#${esc(x)}</span>`).join(''):''}${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">Open link</a>`:''}</div></div>
      <div class="tm ${u}">${t.start?`<b>${tp(t.start)[0]}</b><span>${tp(t.start)[1]}</span>${t.end?`<small>to ${t12(t.end)}</small>`:''}`:'<span>All day</span>'}</div></div></div>`}).join('')+'</div>').join('');
  newId=null;
}

function addTask(){
  const v=inp.value.trim();if(!v)return;
  const t=Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),done:false,rem:S.rem.slice(),fired:[],subs:[]},parse(v));t.fired=fireTimes(t).filter(f=>f<=Date.now());askPerm();
  tasks.push(t);newId=t.id;Store.save(tasks);inp.value='';preview();{const gt=group(t),want=gt==='Tomorrow'||gt==='Upcoming'?'upcoming':'today';if(want!==tab)setTab(want);else render()}
  const el=list.querySelector('[data-id="'+t.id+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
}
function preview(){
  const v=inp.value.trim();
  if(!v){prev.classList.remove('show');return}
  const p=parse(v),ch=(t,c)=>`<span class="chip" style="--c:${c}">${t}</span>`;
  prev.innerHTML='<b>'+esc(p.title)+'</b>'+ch(dateTxt(p.date),'var(--blue)')+(p.start?ch(timeTxt(p),'#ff9500'):'')+(p.repeat?ch('↻ '+repTxt(p),'#34c759'):'')+ch(p.category,COLORS[p.category])+(p.pri?ch(PRL[p.pri],{high:'#ff3b30',med:'#ff9500',low:'#007aff'}[p.pri]):'')+p.tags.map(x=>ch('#'+esc(x),'#8e8e93')).join('')+(p.link?ch('Link','#8e8e93'):'');
  prev.classList.add('show');
}

$('#add').addEventListener('click',addTask);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});
inp.addEventListener('input',preview);
/* ---------- reminders (V2) ---------- */
const OPTS=[[1440,'1 day before'],[60,'1 hour before'],[10,'10 minutes before'],[0,'At the time']];
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const baseAt=t=>new Date(t.date+'T'+(t.start||'09:00')+':00').getTime();
function fireTimes(t){const b=baseAt(t),a=(t.rem||[]).map(o=>b-o*60000);if(t.snooze)a.push(t.snooze);return a}
const msgFor=t=>t.category+' · '+dateTxt(t.date)+(t.start?' · '+timeTxt(t):'');
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2147483647};
let curId=null,bnTask=null,bnTimer;
function showBanner(t){
  bnTask=t;$('#bn-t').textContent=t.title;$('#bn-s').textContent=msgFor(t);
  $('#bn-sn').textContent='Snooze '+S.snooze+' min';$('#banner').classList.add('show');clearTimeout(bnTimer);bnTimer=setTimeout(hideBanner,9000);
  if(navigator.vibrate)navigator.vibrate([120,60,120]);
  try{if(!LN()&&window.Notification&&Notification.permission==='granted')new Notification(t.title,{body:msgFor(t)})}catch(e){}
}
const hideBanner=()=>$('#banner').classList.remove('show');
function tick(){
  const now=Date.now();let ch=false;
  tasks.forEach(t=>{if(t.done)return;t.fired=t.fired||[];const end=endAt(t).getTime();
    fireTimes(t).forEach(f=>{if(f<=now&&f<end&&f>now-6*36e5&&!t.fired.includes(f)){t.fired.push(f);ch=true;showBanner(t)}})});
  if(ch)Store.save(tasks);
}
async function sync(){ /* real notifications when running as an Android app (Capacitor) */
  const ln=LN();if(!ln)return;
  try{
    const p=await ln.getPending();if(p.notifications.length)await ln.cancel({notifications:p.notifications});
    const now=Date.now(),n=[];
    tasks.forEach(t=>{if(!t.done)fireTimes(t).forEach(f=>{if(f>now)n.push({id:hash(t.id+f),title:t.title,body:msgFor(t),at:f})})});
    if(S.morning)morningList().forEach(x=>n.push(x));
    n.sort((a,b)=>a.at-b.at);
    if(n.length)await ln.schedule({notifications:n.slice(0,60).map(x=>({id:x.id,title:x.title,body:x.body,schedule:{at:new Date(x.at),allowWhileIdle:true}}))});
  }catch(e){}
}
async function askPerm(){
  try{const ln=LN();if(ln)await ln.requestPermissions();else if(window.Notification&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}
  bellState();
}
function bellState(){$('#bell').classList.toggle('off',!LN()&&!(window.Notification&&Notification.permission==='granted'))}
function drawSheet(){
  const t=tasks.find(x=>x.id===curId);if(!t)return;
  $('#sh-t').textContent=t.title;$('#sh-s').textContent=msgFor(t)+(t.snooze&&t.snooze>Date.now()?' · snoozed':'');
  $('#sh-r').innerHTML=OPTS.map(o=>`<button class="opt${t.rem.includes(o[0])?' on':''}" data-o="${o[0]}">${o[1]}<span class="tick">✓</span></button>`).join('');
  $('#sh-sub').innerHTML=(t.subs||[]).map((x,i)=>`<div class="opt${x.d?' on':''}" data-s="${i}"><span>${esc(x.t)}</span><span><span class="tick">✓</span> <button data-x="${i}" aria-label="Remove step" style="color:var(--sub);padding:0 4px">✕</button></span></div>`).join('');
  const ed=effDays(t);
  $('#sh-days').innerHTML=['S','M','T','W','T','F','S'].map((l,i)=>`<button data-d="${i}" class="${ed.includes(i)?'on':''}">${l}</button>`).join('');
  $('#sh-rt').textContent=t.repeat?'Repeats: '+repTxt(t):'Does not repeat';
  $('#sh-histh').hidden=!t.repeat;$('#sh-hist').innerHTML=t.repeat?history(t):'';
}
function openSheet(t){curId=t.id;drawSheet();$('#ov').classList.add('show');$('#sheet').classList.add('show')}
function closeSheet(){$('#ov').classList.remove('show');document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('show'))}
$('#ov').addEventListener('click',closeSheet);
$('#bell').addEventListener('click',askPerm);
$('#sh-r').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;const t=tasks.find(x=>x.id===curId),o=+b.dataset.o;

function advance(t){
  const dd=t.repeat==='days'&&t.days&&t.days.length?t.days:null,step=t.repeat==='daily'||dd?1:7;let d=new Date(t.date+'T00:00:00');
  do{d=addDays(d,step)}while((dd&&!dd.includes(d.getDay()))||endAt({date:ymd(d),start:t.start,end:t.end})<new Date());
  t.date=ymd(d);delete t.snooze;(t.subs||[]).forEach(x=>x.d=false);t.fired=fireTimes(t).filter(f=>f<=Date.now());
}
function toggleDone(t,row){
  if(!t.done&&window.webPulse){const q=row.querySelector('.chk').getBoundingClientRect();webPulse(q.left+q.width/2,q.top+q.height/2)}buzz(12);row.querySelector('.chk').classList.toggle('on');row.classList.toggle('done');
  setTimeout(()=>{if(!t.done)logDone(t);if(!t.done&&t.repeat)advance(t);else t.done=!t.done;Store.save(tasks);render()},380);
}
function removeTask(t,row){
  row.style.maxHeight=row.offsetHeight+'px';
  requestAnimationFrame(()=>{row.classList.add('leave');row.style.maxHeight='0'});
  setTimeout(()=>{tasks=tasks.filter(x=>x.id!==t.id);Store.save(tasks);render()},300);
}

  const row=e.target.closest('.row');if(!row)return;const t=tasks.find(x=>x.id===row.dataset.id);if(!t)return;

list.addEventListener('pointerdown',e=>{const row=e.target.closest('.row');if(!row||e.target.closest('a'))return;sw={row,x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId}});
list.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)<10)return;
    sw.on=true;sw.row.classList.add('drag');try{sw.row.setPointerCapture(sw.id)}catch(_){}}
  const t=tasks.find(x=>x.id===sw.row.dataset.id);sw.dx=dx;
  sw.row.style.setProperty('--dx',dx+'px');sw.row.dataset.sw=dx>0?'r':'l';sw.row.dataset.lbl=dx>0?(t&&t.done?'Undo':'Done'):'Delete';

function endSwipe(){
  if(!sw)return;const{row,dx,on}=sw;sw=null;if(!on)return;
  justSwiped=Date.now();row.classList.remove('drag');row.style.setProperty('--dx','0px');
  const t=tasks.find(x=>x.id===row.dataset.id);
  if(t&&dx>90)toggleDone(t,row);else if(t&&dx<-90)removeTask(t,row);else setTimeout(()=>{delete row.dataset.sw},300);

$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('#sh-days button,[data-p]');if(!b)return;const t=tasks.find(x=>x.id===curId);if(!t)return;
  let d=effDays(t).slice();
  if(b.dataset.p){d=b.dataset.p==='all'?[0,1,2,3,4,5,6]:b.dataset.p==='wk'?[1,2,3,4,5]:[]}
  else{const i=+b.dataset.d;d=d.includes(i)?d.filter(x=>x!==i):d.concat(i)}
  d.sort();
  if(d.length){t.repeat='days';t.days=d;let x=new Date(t.date+'T00:00:00');for(let g=0;g<8&&!d.includes(x.getDay());g++)x=addDays(x,1);t.date=ymd(x)}
  else{t.repeat=null;t.days=null}

});

const LOGKEY='taskflow.log';
const buzz=n=>{if(!S.haptics)return;try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function loadLog(){try{return JSON.parse(localStorage.getItem(LOGKEY))||[]}catch(e){return[]}}
function saveLog(l){try{localStorage.setItem(LOGKEY,JSON.stringify(l.slice(-2000)))}catch(e){}}
function logDone(t){const L=loadLog();L.push({d:ymd(new Date()),ok:endAt(t).getTime()>=Date.now(),id:t.id});saveLog(L)}
function stats(){
  const L=loadLog(),days=new Set(L.map(x=>x.d));let n=0,d=new Date();
  if(!days.has(ymd(d)))d=addDays(d,-1);
  while(days.has(ymd(d))){n++;d=addDays(d,-1)}
  const w=[...Array(7)].map((_,i)=>{const k=ymd(addDays(new Date(),i-6));return{k,c:L.filter(x=>x.d===k).length}});
  const m=L.filter(x=>x.d>=ymd(addDays(new Date(),-29)));
  return{streak:n,week:w.reduce((a,b)=>a+b.c,0),ok:m.length?Math.round(m.filter(x=>x.ok).length*100/m.length)+'%':'–',w};
}

function drawDash(){
  if(tab!=='today')return;
  const now=Date.now(),td=ymd(new Date()),done=loadLog().filter(x=>x.d===td).length;
  const left=tasks.filter(t=>!t.done&&['Overdue','Today'].includes(group(t))).length,tot=done+left;
  $('#rp').style.strokeDashoffset=(169.6*(1-(tot?done/tot:0))).toFixed(1);
  $('#rn').textContent=tot?done+' of '+tot+' done':'Nothing yet';
  $('#rs').textContent=!tot?'Add a task below':left?left+(left===1?' task left today':' tasks left today'):'All done. Nice work';
  const all=tot>0&&left===0;if(lastAll===false&&all)sparks();lastAll=all;
  const c=tasks.filter(t=>!t.done).map(t=>{const st=t.start?baseAt(t):null,en=endAt(t).getTime();return{t,st,en,live:st!==null&&st<=now&&now<en}})
    .filter(x=>x.en>now&&(x.live||(x.st??x.en)-now<36*36e5)).sort((a,b)=>(b.live-a.live)||((a.st??a.en)-(b.st??b.en)));
  const n=c[0];nextT=n?n.t:null;$('#next').hidden=!n;
  if(n){const t=n.t,when=n.live?n.en-now:(n.st??n.en)-now;
    $('#nico').style.setProperty('--c',COLORS[t.category]);
    $('#nico').className='nico'+(!n.live&&n.st!==null&&when<36e5?' pulse'+(when<6e5?' fast':''):'');
    $('#nlab').textContent=n.live?'Happening now':'Next up';$('#nt').textContent=t.title;$('#nm').textContent=t.category+' · '+timeTxt(t);
    $('#nc').innerHTML='<b>'+fmtIn(when)+'</b><span>'+(n.live?'left':'to go')+'</span>'}

function history(t){
  const done=new Set(loadLog().filter(x=>x.id===t.id).map(x=>x.d)),ed=effDays(t),now=new Date(),td=ymd(now);
  const start=addDays(now,-now.getDay()-21),first=[...done].sort()[0]||'9999-12-31';let cells='',sch=0,dn=0;
  for(let i=0;i<28;i++){const d=addDays(start,i),k=ymd(d),fut=k>td,sc=ed.includes(d.getDay()),h=done.has(k);
    if(!fut){if(sc&&k>=first&&(k<td||h))sch++;if(h)dn++}
    cells+=`<i class="${h?'d':(!fut&&sc&&k<td&&k>=first)?'m':'n'}${k===td?' t':''}"></i>`}
  let st=0;for(let i=0;i<400;i++){const d=addDays(now,-i),k=ymd(d);if(done.has(k)){st++;continue}if(!ed.includes(d.getDay())||k===td)continue;break}
  return `<div class="stats" style="margin-top:0"><div class="stat"><b>${st}</b><span>Streak</span></div><div class="stat"><b>${dn}</b><span>Done, 4 weeks</span></div><div class="stat"><b>${sch?Math.min(100,Math.round(dn*100/sch)):0}%</b><span>Kept up</span></div></div><div class="hist" style="margin-top:10px">`+['S','M','T','W','T','F','S'].map(l=>`<em>${l}</em>`).join('')+cells+`</div><p class="sm" style="margin:8px 6px 0">History counts from your first completion after updating to this version.</p>`;
}

/* ---------- morning summary + automatic backup (V5) ---------- */
function tasksOn(ds){
  const wd=new Date(ds+'T00:00:00').getDay();
  return tasks.filter(t=>!t.done&&(t.date===ds||(t.repeat&&t.date<ds&&effDays(t).includes(wd))));
}
function morningList(){
  const out=[],[hh,mm]=(S.morningTime||'07:30').split(':').map(Number),now=Date.now(),td=ymd(new Date());
  for(let i=0;i<7;i++){
    const d=addDays(new Date(),i);d.setHours(hh,mm,0,0);if(d.getTime()<=now)continue;
    const ds=ymd(d),list=tasksOn(ds).sort((a,b)=>(a.start||'99:99')<(b.start||'99:99')?-1:1);
    const od=i===0?tasks.filter(t=>!t.done&&endAt(t).getTime()<now).length:0;
    if(!list.length&&!od)continue;
    const first=list.find(t=>t.start);
    const body=(list.length?list.length+(list.length===1?' task today':' tasks today')+(first?' · first: '+first.title+' at '+t12(first.start):''):'')+(od?(list.length?' · ':'')+od+' overdue':'');
    out.push({id:900000000+i,title:'Good morning'+(S.name?', '+S.name:''),body,at:d.getTime()});
  }
  return out;
}
const FS=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem;
async function askFsPerm(){try{const f=FS();if(f&&f.requestPermissions)await f.requestPermissions()}catch(e){}}
async function autoBackup(force){
  const fs=FS();if(!fs)return false;
  const td=ymd(new Date());
  if(!force){if(S.autoBackup==='off')return false;const gap=S.autoBackup==='weekly'?7:1;if(S.lastBackup&&(new Date(td)-new Date(S.lastBackup))/864e5<gap)return false}
  try{
    await fs.writeFile({path:'TaskFlow/taskflow-backup-'+td+'.json',data:backup(),directory:'DOCUMENTS',encoding:'utf8',recursive:true});
    S.lastBackup=td;S.lastBackupErr='';saveS();
    try{const r=await fs.readdir({path:'TaskFlow',directory:'DOCUMENTS'}),names=r.files.map(f=>f.name||f).filter(n=>/^taskflow-backup-.*\.json$/.test(n)).sort();
      for(const n of names.slice(0,-5))await fs.deleteFile({path:'TaskFlow/'+n,directory:'DOCUMENTS'}).catch(()=>{})}catch(e){}
    return true;
  }catch(e){S.lastBackupErr=String((e&&e.message)||e).slice(0,70);saveS();return false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){autoBackup(false);sync()}});
setTimeout(()=>autoBackup(false),4000);

/* ---------- web effect (V3): connected-dots network, parallax, tap burst, completion pulse ---------- */
(function(){
  const cv=$('#web'),cx=cv&&cv.getContext&&cv.getContext('2d');
  if(!cx){window.webBurst=window.webPulse=()=>{};return}
  let W=0,H=0,dpr=1,nodes=[],bursts=[],pulses=[],raf=0,last=0,rgb=[0,122,255];
  const mod=(a,n)=>((a%n)+n)%n,rm=matchMedia('(prefers-reduced-motion: reduce)');
  const on=()=>S.web&&S.anim&&!document.hidden&&!rm.matches;
  function size(){
    dpr=Math.min(S.lite?1:2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(S.lite?18:40,Math.max(14,W*H/(S.lite?22000:11000))));
    if(nodes.length!==n)nodes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H*1.3,z:.35+Math.random()*.65,vx:(Math.random()-.5)*.014,vy:(Math.random()-.5)*.014,b:0,px:0,py:0}));
  }
  function drawBursts(dt,col,sc){
    bursts=bursts.filter(g=>g.life>0);
    for(const g of bursts){
      g.life-=dt;const k=Math.max(0,g.life/g.max),f=Math.pow(.93,dt/16);
      for(const q of g.pts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=f;q.vy*=f}
      cx.lineWidth=1.1;
      for(const q of g.pts){
        cx.strokeStyle=col(.6*k*sc+.1*k);cx.beginPath();cx.moveTo(g.x,g.y);cx.lineTo(q.x,q.y);cx.stroke();
        if(!S.lite)for(const n of nodes){const d=Math.hypot(q.x-n.px,q.y-n.py);if(d<110){cx.strokeStyle=col((1-d/110)*.5*k);cx.beginPath();cx.moveTo(q.x,q.y);cx.lineTo(n.px,n.py);cx.stroke()}}
      }
      for(let i=0;i<g.pts.length;i++)for(let j=i+1;j<g.pts.length;j++){const a=g.pts[i],b=g.pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<100){cx.strokeStyle=col((1-d/100)*.5*k);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
      cx.fillStyle=col(.9*k);
      for(const q of g.pts){cx.beginPath();cx.arc(q.x,q.y,2.2,0,6.283);cx.fill()}
      cx.beginPath();cx.arc(g.x,g.y,3.2*k+1,0,6.283);cx.fill();
    }
  }
  function frame(ts){
    if(!on()){raf=0;cx.clearRect(0,0,W,H);return}
    raf=requestAnimationFrame(frame);
    if(S.lite&&ts-last<40)return;
    const dt=Math.min(50,ts-(last||ts));last=ts;
    cx.clearRect(0,0,W,H);
    const HW=H*1.3,off=(HW-H)/2,sy=scrollY,sc=document.documentElement.dataset.theme==='dark'?1:.6;
    const col=a=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
    pulses=pulses.filter(p=>ts-p.t<1700);
    for(const n of nodes){
      n.x=mod(n.x+n.vx*dt,W);n.y=mod(n.y+n.vy*dt,HW);
      n.px=n.x;n.py=mod(n.y-sy*.3*n.z,HW)-off;n.b=0;
      for(const p of pulses){const age=(ts-p.t)/1000,d=Math.hypot(n.px-p.x,n.py-p.y);n.b=Math.max(n.b,Math.max(0,1-Math.abs(d-age*440)/70)*(1-age/1.7))}
    }
    const D=S.lite?105:130;cx.lineCap='round';
    for(let i=0;i<nodes.length;i++){const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){const b=nodes[j],d=Math.hypot(a.px-b.px,a.py-b.py);
        if(d<D){const bo=(a.b+b.b)/2;cx.strokeStyle=col(Math.min(.9,(1-d/D)*.34*sc*((a.z+b.z)/2+.3)+bo*.55));cx.lineWidth=.8+bo*1.6;cx.beginPath();cx.moveTo(a.px,a.py);cx.lineTo(b.px,b.py);cx.stroke()}}}
    for(const n of nodes){cx.fillStyle=col(Math.min(1,.5*sc*n.z+.2*sc+n.b*.5));cx.beginPath();cx.arc(n.px,n.py,1.4+n.z*1.3+n.b*2.8,0,6.283);cx.fill()}
    for(const p of pulses){const age=(ts-p.t)/1000;cx.strokeStyle=col(.22*(1-age/1.7)*sc);cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,age*440,0,6.283);cx.stroke()}
    drawBursts(dt,col,sc);
  }
  const start=()=>{if(!raf&&on()){last=0;raf=requestAnimationFrame(frame)}};
  const stop=()=>{cancelAnimationFrame(raf);raf=0;cx.clearRect(0,0,W,H)};
  window.webBurst=(x,y)=>{
    if(!on())return;const c=S.lite?5:8;
    bursts.push({x,y,life:900,max:900,pts:Array.from({length:c},(_,i)=>{const a=i/c*6.283+Math.random()*.6,v=.25+Math.random()*.2;return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v}})});
    if(bursts.length>5)bursts.shift();
  };
  window.webPulse=(x,y)=>{if(on())pulses.push({x,y,t:performance.now()})};
  window.__webApply=()=>{rgb=[1,3,5].map(i=>parseInt(S.accent.slice(i,i+2),16));cv.style.display=S.web?'block':'none';size();on()?start():stop()};
  addEventListener('resize',size);
  addEventListener('pointerdown',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))window.webBurst(e.clientX,e.clientY)},{passive:true});
  document.addEventListener('visibilitychange',()=>{on()?start():stop()});
  window.__webApply();
})();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){

}
