<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TaskFlow</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--txt:#111114;--sub:#8a8a8e;--sep:rgba(60,60,67,.14);--blue:#007aff;--red:#ff3b30;--orange:#ff9500;--green:#34c759;--bar:rgba(250,250,252,.96);--tabh:56px;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05)}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--txt:#f5f5f7;--sub:#8e8e93;--sep:rgba(84,84,88,.5);--bar:rgba(16,16,18,.97);--shadow:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:-apple-system,"SF Pro Text","Inter",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
button:active{opacity:.55}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(190px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(max(env(safe-area-inset-top,0px),28px) + 26px) 4px 12px}
h1{font-size:34px;font-weight:700;letter-spacing:.2px}
.count{color:var(--sub);font-size:15px;margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--blue);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
body[data-tab=progress] #cbtn,body[data-tab=settings] #cbtn{display:none}
h2{font-size:13px;font-weight:600;color:var(--sub);margin:20px 6px 8px}
h2.od{color:var(--red)}
.prog{display:flex;align-items:center;gap:12px;margin:2px 6px 12px}
.pbar{flex:1;height:7px;border-radius:4px;background:var(--sep);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--blue);border-radius:4px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
#ptxt{font-size:13px;color:var(--sub);white-space:nowrap}
.next{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.next .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.next div{flex:1;min-width:0}
.next small{display:block;font-size:12px;color:var(--sub)}
.next b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next em{font-style:normal;font-size:15px;font-weight:600;color:var(--blue);white-space:nowrap}
#flt{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 0;scrollbar-width:none}
#flt::-webkit-scrollbar,#qs::-webkit-scrollbar{display:none}
#flt button{flex:none;padding:6px 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:500;box-shadow:var(--shadow)}
#flt button.on{background:var(--blue);color:#fff}
.trow{position:relative;margin-bottom:8px;border-radius:16px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:max-height .3s ease,opacity .25s,margin .3s}
.trow[data-sw=r]{background:var(--green)}.trow[data-sw=l]{background:var(--red)}
.trow[data-sw]::after{content:attr(data-lbl);position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-weight:600;font-size:15px}
.trow[data-sw=r]::after{left:18px}.trow[data-sw=l]::after{right:18px}
.trow.leave{opacity:0;margin-bottom:0}
.trow.enter{animation:pop .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.task{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:58px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);transform:translateX(var(--dx,0px));transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.task.pr{background:color-mix(in srgb,var(--c) 15%,var(--card))}
.task.pr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.trow.drag .task{transition:none}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.tt span.od{color:var(--red);font-weight:600}.tt span.soon{color:var(--orange);font-weight:600}
.trow.done .tt b{text-decoration:line-through;color:var(--sub)}
.trow.done .task{opacity:.6}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:1.6px solid var(--sub);position:relative;transition:background .2s,border-color .2s}
.chk::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.chk.on{background:var(--blue);border-color:var(--blue)}.chk.on::after{transform:rotate(45deg) scale(1)}
.empty{text-align:center;color:var(--sub);margin-top:80px;padding:0 24px;line-height:1.5}
.empty b{display:block;font-size:20px;color:var(--txt);margin-bottom:6px}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));background:var(--bar);border-top:.5px solid var(--sep);padding:8px 16px 10px;z-index:4}
.dock-in{max-width:520px;margin:0 auto}
#qs{display:none;gap:8px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.kb #qs{display:flex}
#qs button{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:500;color:var(--blue);box-shadow:var(--shadow)}
#prev{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:0 4px 8px}
#prev.show{display:flex}
#prev b{font-size:13px;font-weight:600;margin-right:2px}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.field{display:flex;gap:8px;align-items:center}
#in{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--txt);background:var(--card);border:.5px solid var(--sep);border-radius:22px;padding:10px 16px;outline:none}
#add{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--bar);border-top:.5px solid var(--sep);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:11px;font-weight:500}
.tabs button.on{color:var(--blue)}
.kb .tabs{display:none}.kb .dock{bottom:0}
body[data-tab=progress] .dock,body[data-tab=settings] .dock{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s;z-index:21}
.sheet.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s}
#pick{z-index:23}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
.sheet h3{font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sheet h4{font-size:13px;font-weight:600;color:var(--sub);margin:18px 6px 6px}
.sm{color:var(--sub);font-size:14px;margin-top:3px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chipbtn{flex:none;padding:7px 16px;border-radius:999px;background:var(--card);color:var(--blue);font-weight:600;font-size:15px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.desc{margin-top:12px;padding:12px 14px;background:var(--card);border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{background:var(--card);border-radius:14px;overflow:hidden}
.opts:empty{display:none}
.opt,.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 14px;font-size:17px;text-align:left;min-height:48px}
.opt+.opt,.srow+.srow,.opts>*+*{border-top:.5px solid var(--sep)}
.srow.col{flex-direction:column;align-items:stretch;gap:10px}
.srow .v{color:var(--sub)}
.srow.btn{color:var(--blue)}.srow.danger,.opt.danger{color:var(--red)}
a.srow{color:var(--txt);text-decoration:none}
label.srow{cursor:pointer}
.opt .tick{color:var(--blue);opacity:0}.opt.on .tick{opacity:1}
.opt.on>span:first-child{color:var(--sub);text-decoration:line-through}
.pbtn{width:100%;padding:14px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;margin-top:20px}
.tbtn{width:100%;padding:12px;color:var(--sub);font-size:16px}
.seg{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px}
.sheet .seg,.opts .seg{background:var(--sep)}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 30%}
.seg.multi button.on{background:var(--blue);color:#fff;box-shadow:none}
.days{display:flex;gap:6px}
.days button{flex:1;padding:11px 0;border-radius:10px;background:var(--card);font-weight:600;font-size:14px}
.days button.on{background:var(--blue);color:#fff}
.mini{display:flex;gap:18px;margin:10px 6px 0}.mini button{color:var(--blue);font-size:15px;font-weight:600}
.tin{font:inherit;font-size:17px;color:var(--txt);background:transparent;border:0;outline:none;text-align:right;width:58%}
textarea.tin{width:100%;text-align:left;resize:none;min-height:70px;line-height:1.4;padding:2px 0}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.32);transition:background .25s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+i{background:var(--green)}.sw input:checked+i::after{transform:translateX(20px)}
.dots{display:flex;gap:14px}
.dots button{width:30px;height:30px;border-radius:50%;background:var(--c);outline:2px solid transparent;outline-offset:3px}
.dots button.on{outline-color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--card);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:700}.stat span{font-size:12px;color:var(--sub)}
.bars{display:flex;gap:6px;align-items:flex-end;height:72px;margin-top:12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px 22px}
.bars div{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}
.bars i{width:100%;background:var(--blue);border-radius:4px 4px 2px 2px;min-height:3px;transition:height .5s cubic-bezier(.2,.9,.3,1)}
.bars em{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--sub)}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.hist em{font-style:normal;text-align:center;font-size:11px;color:var(--sub)}
.hist i{aspect-ratio:1;border-radius:7px;background:var(--card)}
.hist i.d{background:var(--blue)}.hist i.m{background:rgba(255,59,48,.25)}.hist i.n{opacity:.45}.hist i.t{outline:2px solid var(--blue);outline-offset:1px}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.group>*+*{border-top:.5px solid var(--sep)}
.wheels{position:relative;display:flex;height:180px;margin-top:6px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:72px;height:36px;border-radius:10px;background:var(--sep);pointer-events:none}
.wi{flex:1;height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wi::-webkit-scrollbar{display:none}
.wi .pad{height:72px}
.wi .it{height:36px;line-height:36px;text-align:center;font-size:21px;scroll-snap-align:center}
.phead{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.phead>button{min-width:60px;color:var(--blue);font-size:17px;font-weight:600}
.phead>button:last-child{text-align:right}.phead b{font-size:17px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.cb{flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center}
.cm{flex:1;min-width:0}.cm b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.cm span{font-size:13px;color:var(--sub)}
.cadd{flex:none;padding:6px 14px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;font-size:14px}
.cadd.on{background:var(--sep);color:var(--sub)}
.banner{position:fixed;top:calc(max(env(safe-area-inset-top,0px),32px) + 8px);left:12px;right:12px;max-width:496px;margin:0 auto;z-index:30;background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px 14px;transform:translateY(-250%);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .25s,visibility .35s}
.banner.show{transform:none;opacity:1;visibility:visible}
.banner b{display:block;font-size:15px}.banner span{font-size:14px;color:var(--sub)}
.acts{display:flex;gap:18px;margin-top:8px}.acts button{color:var(--blue);font-size:15px;font-weight:600}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><div><h1 id="ttl">Today</h1><div class="count" id="count"></div></div>
    <button class="ibtn" id="cbtn" aria-label="Contests"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2.5 4 2.5 4H5"/></svg></button></header>
  <section id="dash">
    <div class="prog"><div class="pbar"><i id="pfill"></i></div><span id="ptxt"></span></div>
    <button class="next" id="next" hidden><span class="dot"></span><div><small id="nlab">Next up</small><b id="nt"></b></div><em id="nc"></em></button>
  </section>
  <div id="flt"></div>
  <main id="list"></main>
  <section id="progress" hidden></section>
  <section id="settings" hidden></section>
</div>
<div class="dock"><div class="dock-in">
  <div id="qs"><button data-w="today">Today</button><button data-w="tomorrow">Tomorrow</button><button data-w="daily">Daily</button><button data-w="weekdays">Weekdays</button><button data-w="!high">High priority</button><button data-w="contest">Contest</button><button data-w="homework">Homework</button><button data-w="exam">Exam</button><button data-w="at 7pm">7 pm</button></div>
  <div id="prev"></div>
  <div class="field"><input id="in" type="text" placeholder="tomorrow 7:30-10:30 contest on Codeforces" enterkeyhint="done" autocomplete="off"><button id="add" aria-label="Add task">+</button></div>
</div></div>
<nav class="tabs">
  <button data-tab="today" class="on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3M16 2v3M3 9h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg><span>Today</span></button>
  <button data-tab="upcoming"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Upcoming</span></button>
  <button data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V11M12 20V4M18 20v-6"/></svg><span>Progress</span></button>
  <button data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
</nav>
<div class="ov" id="ov"></div>

<div class="sheet" id="sheet"><div class="grab"></div>
  <div class="dhead"><div style="min-width:0"><h3 id="d-t"></h3><div class="sm" id="d-w"></div></div><button class="chipbtn" id="d-edit">Edit</button></div>
  <div class="chips" id="d-chips"></div>
  <p class="desc" id="d-desc" hidden></p>
  <h4>Steps</h4><div class="opts" id="d-steps"></div>
  <div class="field" style="margin-top:8px"><input id="sub-in" type="text" placeholder="Add a step" autocomplete="off" style="flex:1;min-width:0;font:inherit;font-size:16px;color:var(--txt);background:var(--card);border:0;border-radius:12px;padding:11px 14px;outline:none"><button class="ibtn" id="sub-add" aria-label="Add step" style="font-size:24px">+</button></div>
  <h4>Details</h4><div class="opts" id="d-info"></div>
  <h4 id="d-histh">History</h4><div id="d-hist"></div>
  <button class="pbtn" id="d-done">Mark as done</button>
  <h4>Snooze reminder</h4><div class="seg" id="d-sn"><button data-m="10">10 min</button><button data-m="60">1 hour</button><button data-m="tm">Tomorrow</button></div>
  <div class="opts" style="margin-top:18px"><button class="opt danger" id="d-del">Delete task</button></div>
</div>

<div class="sheet" id="edit"><div class="grab"></div><h3>Edit task</h3>
  <div class="opts" style="margin-top:10px">
    <div class="srow"><span>Title</span><input class="tin" id="e-title" maxlength="120" placeholder="Task title"></div>
    <div class="srow col" style="gap:4px"><span>Description</span><textarea class="tin" id="e-desc" maxlength="600" placeholder="Add notes or details"></textarea></div>
  </div>
  <h4>When</h4>
  <div class="opts">
    <button class="srow" id="e-date"><span>Date</span><span class="v" id="e-date-v"></span></button>
    <button class="srow" id="e-st"><span>Starts</span><span class="v" id="e-st-v"></span></button>
    <button class="srow" id="e-en"><span>Ends</span><span class="v" id="e-en-v"></span></button>
  </div>
  <h4>Repeat on</h4><div class="days" id="e-days"></div>
  <div class="mini"><button data-p="all">Every day</button><button data-p="wk">Weekdays</button><button data-p="no">Don't repeat</button></div>
  <div class="sm" id="e-rt" style="margin:8px 6px 0"></div>
  <h4>Remind me</h4><div class="seg multi wrap" id="e-rem"></div>
  <h4>Category</h4><div class="seg wrap" id="e-cat"></div>
  <h4>Priority</h4><div class="seg" id="e-pri"></div>
  <h4>Tags</h4><div class="opts"><div class="srow"><input class="tin" id="e-tags" placeholder="dsa, college" style="width:100%;text-align:left"></div></div>
  <button class="pbtn" id="e-save">Save changes</button><button class="tbtn" id="e-cancel">Cancel</button>
</div>

<div class="sheet" id="cont"><div class="grab"></div>
  <div class="dhead"><div><h3>Contests</h3><div class="sm" id="c-sub"></div></div><button class="chipbtn" id="c-ref">Refresh</button></div>
  <div class="sm" id="c-msg" style="margin:10px 4px 0"></div>
  <div class="group" id="c-list" style="margin-top:12px"></div>
  <p class="sm" style="margin:12px 6px 0">Other platforms? Just type it, like "sat 8pm hackerearth contest". Choose platforms in Settings.</p>
</div>

<div class="sheet" id="pick"><div class="grab"></div>
  <div class="phead"><button id="pk-clear">Clear</button><b id="pk-title"></b><button id="pk-ok">Done</button></div>
  <div class="wheels" id="pk-w"></div>
</div>

<script>
/* ===== core ===== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const DOW=['sun','mon','tue','wed','thu','fri','sat'],DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const COLORS={Contest:'#af52de',Homework:'#007aff',Assignment:'#ff9500',Exam:'#ff3b30',Task:'#8e8e93'};
const PC={high:'#ff3b30',med:'#ff9500',low:'#34c759'},PR={high:0,med:1,low:2},PRL={high:'High',med:'Medium',low:'Low'};
const KEY='taskflow.v1',SKEY='taskflow.settings',LOGKEY='taskflow.log',CKEY='taskflow.contests';
const jget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};

const Store={load:()=>jget(KEY,[]),save(t){jset(KEY,t);setTimeout(sync,0)}};
const DEF={theme:'auto',accent:'#007aff',anim:true,haptics:true,rem:[60,10],snooze:10,name:'',h24:false,ampm:'contest',showDone:true,tags:true,morning:true,morningTime:'07:30',autoBackup:'weekly',lastBackup:'',lastBackupErr:'',src:{codeforces:true,leetcode:true,codechef:true,atcoder:true}};
let S=Object.assign({},DEF,jget(SKEY,{}));S.src=Object.assign({},DEF.src,S.src||{});
const saveS=()=>jset(SKEY,S);
function applyTheme(){
  const dark=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.setProperty('--blue',S.accent);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#000000':'#f2f2f7';

try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
applyTheme();
const buzz=n=>{if(!S.haptics)return;try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ===== parser ===== */
/* ---------- natural-language parser ---------- */
function parse(text){
  let s=' '+text+' ';
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const cut=re=>{const m=s.match(re);if(m)s=s.replace(re,' ');return m};
  const cat=/contest|codeforces|leetcode|codechef|atcoder|hackathon|hackerrank|hackerearth|geeksforgeeks|gfg|topcoder|kickstart|codingame/i.test(s)?'Contest'
    :/homework|\bhw\b/i.test(s)?'Homework'
    :/assignment|submission|submit|project/i.test(s)?'Assignment'
    :/exam|quiz|viva|\btest\b/i.test(s)?'Exam':'Task';
  // time: no am/pm -> 1-6 means PM; 7-11 means PM only for contests
  const conv=(h,m,mer)=>{h=+h;m=+(m||0);
    if(mer){mer=mer.toLowerCase();if(mer==='pm'&&h<12)h+=12;if(mer==='am'&&h===12)h=0}
    else if(h>=1&&h<=6)h+=12;else if(h>=7&&h<=11&&(S.ampm==='pm'||(S.ampm==='contest'&&cat==='Contest')))h+=12;
    return pad(h)+':'+pad(m)};
  let st=null,en=null,m;
  const lk=cut(/\s((?:https?:\/\/|www\.)\S+)/i);let link=lk?lk[1].replace(/[.,;)]+$/,''):null;
  if(link&&!/^https?:/i.test(link))link='https://'+link;
  let pri=null;const tags=[];
  if(m=cut(/\s!(high|medium|med|low|h|m|l)(?=[\s,.]|$)/i))pri={h:'high',m:'med',l:'low'}[m[1][0].toLowerCase()];
  else if(m=cut(/\s(high|medium|low)\s+priority(?=[\s,.]|$)/i))pri={h:'high',m:'med',l:'low'}[m[1][0].toLowerCase()];
  for(let k=0;k<6&&(m=cut(/\s#([a-z0-9_-]+)(?=[\s,.]|$)/i));k++)tags.push(m[1].toLowerCase());
  if(m=cut(/\s(?:from\s+|at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|till|until)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?(?=[\s,.])/i)){
    const mer=m[3]||m[6];st=conv(m[1],m[2],mer);en=conv(m[4],m[5],m[6]||m[3]);
  }else if(m=cut(/\s(?:at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=[\s,.])/i)){st=conv(m[1],m[2],m[3])}
  else if(m=cut(/\s(?:at\s+|@\s*)?(\d{1,2}):(\d{2})(?=[\s,.])/i)){st=conv(m[1],m[2])}
  else if(m=cut(/\sat\s+(\d{1,2})(?=[\s,.])/i)){st=conv(m[1])}
  // date + repeat
  let d=null,rp=null,dys=null;
  const WD='(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)';
  const dl=x=>[...new Set((x.match(new RegExp(WD,'gi'))||[]).map(w=>DOW.indexOf(w.slice(0,3).toLowerCase())))].sort();
  const LST='((?:'+WD+'(?:\\s*(?:,|and|&)?\\s*))+)';
  if(m=cut(new RegExp('\\s(?:every\\s*day|daily)\\s+(?:except|but not|excluding|other than)\\s+'+LST+'(?=[\\s,.]|$)','i'))){
    const ex=dl(m[1]);dys=[0,1,2,3,4,5,6].filter(x=>!ex.includes(x));rp='days';
  }else if(cut(/\s(?:every\s+weekday|weekdays)(?=[\s,.])/i)){dys=[1,2,3,4,5];rp='days'}
  else if(cut(/\s(?:every\s+weekend|weekends)(?=[\s,.])/i)){dys=[0,6];rp='days'}
  else if((m=s.match(new RegExp('\\severy\\s+'+LST+'(?=[\\s,.]|$)','i')))&&dl(m[1]).length>1){s=s.replace(m[0],' ');dys=dl(m[1]);rp='days'}
  else if(m=cut(/\severy\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)(?=[\s,.])/i)){
    rp='weekly';d=addDays(today,(DOW.indexOf(m[1].slice(0,3).toLowerCase())-today.getDay()+7)%7);
  }else if(cut(/\s(?:every\s*day|daily)(?=[\s,.])/i))rp='daily';
  else if(cut(/\s(?:every\s+week|weekly)(?=[\s,.])/i))rp='weekly';
  const mk=(dd,mm,yy)=>{let y=yy?(+yy<100?2000+ +yy:+yy):today.getFullYear();let x=new Date(y,mm,+dd);if(!yy&&x<today)x=new Date(y+1,mm,+dd);return x};
  if(d){}else if(cut(/\sday after\s+(?:to+m+o+r+o+w|tmrw)(?=[\s,.])/i))d=addDays(today,2);
  else if(cut(/\s(?:to+m+o+r+o+w|tmrw|tmr)(?=[\s,.])/i))d=addDays(today,1);
  else if(cut(/\s(?:today|tonight)(?=[\s,.])/i))d=today;
  else if(m=cut(/\sin\s+(\d+)\s+days?(?=[\s,.])/i))d=addDays(today,+m[1]);
  else if(m=cut(/\s(?:(next|this|on)\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)(?=[\s,.])/i)){
    let diff=(DOW.indexOf(m[2].slice(0,3).toLowerCase())-today.getDay()+7)%7;
    if(diff===0&&m[1]&&m[1].toLowerCase()==='next')diff=7;d=addDays(today,diff);
  }else if(m=cut(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=[\s,.])/))d=mk(m[1],m[2]-1,m[3]);
  else if(m=cut(/\s(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?=[\s,.])/i))d=mk(m[1],MON.indexOf(m[2].toLowerCase()));
  else if(m=cut(/\s(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?(?=[\s,.])/i))d=mk(m[2],MON.indexOf(m[1].toLowerCase()));
  const nowT=pad(now.getHours())+':'+pad(now.getMinutes());
  if(!d){d=today;if(st&&st<nowT)d=addDays(today,rp==='weekly'?7:1)}
  else if(rp==='weekly'&&st&&ymd(d)===ymd(today)&&st<nowT)d=addDays(d,7);
  if(rp==='days'){let g=0;while(g++<8&&(!dys.includes(d.getDay())||(ymd(d)===ymd(today)&&st&&st<nowT)))d=addDays(d,1)}
  // title
  let title=s.replace(/\s+/g,' ').trim()
    .replace(/^(?:(?:at|on|from|by|due|the|-|,)\s+)+/i,'').replace(/(?:\s+(?:at|on|from|by|due|-|,))+$/i,'').trim();
  title=title?title[0].toUpperCase()+title.slice(1):cat;
  return{title,category:cat,date:ymd(d),start:st,end:en,repeat:rp,days:dys,link,pri,tags};
}


/* ===== formatting ===== */
const t12=t=>{let[h,m]=t.split(':').map(Number);if(S.h24)return pad(h)+':'+pad(m);return(h%12||12)+':'+pad(m)+' '+(h>=12?'PM':'AM')};
function timeTxt(t){if(!t.start)return'All day';const a=t12(t.start);if(!t.end)return a;const b=t12(t.end);return(!S.h24&&a.slice(-2)===b.slice(-2)?a.slice(0,-3):a)+' – '+b}
function dateTxt(ds){const td=ymd(new Date());if(ds===td)return'Today';if(ds===ymd(addDays(new Date(),1)))return'Tomorrow';
  return new Date(ds+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
const fullDate=ds=>new Date(ds+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const endAt=t=>new Date(t.date+'T'+(t.end||t.start||'23:59')+':00');
const baseAt=t=>new Date(t.date+'T'+(t.start||'09:00')+':00').getTime();
function group(t){if(t.done)return'Completed';if(endAt(t)<new Date())return'Overdue';
  const td=ymd(new Date());if(t.date===td)return'Today';if(t.date===ymd(addDays(new Date(),1)))return'Tomorrow';return'Upcoming'}
function urg(t){
  if(t.done)return'';const now=Date.now();if(endAt(t).getTime()<now)return'od';
  if(!t.start)return t.date===ymd(new Date())?'soon':'';
  return baseAt(t)-now<3*36e5?'soon':'';
}
const fmtIn=ms=>{const m=Math.max(0,Math.round(ms/60000));if(m<1)return'now';if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+'h '+pad(m%60)+'m';const d=Math.round(h/24);return d+(d===1?' day':' days')};
const fmtDur=ms=>{const m=Math.round(ms/60000),d=Math.floor(m/1440);if(d>=2)return d+' days';return Math.floor(m/60)+'h'+(m%60?' '+pad(m%60)+'m':'')};

/* ===== repeat rules ===== */
const effDays=t=>t.repeat==='daily'?[0,1,2,3,4,5,6]:t.repeat==='weekly'?[new Date(t.date+'T00:00:00').getDay()]:t.repeat==='days'?(t.days||[]):[];
function repTxt(t){
  if(t.repeat==='daily')return'Daily';if(t.repeat==='weekly')return'Weekly';
  const d=t.days||[];if(d.length===7)return'Daily';if(d.join()==='1,2,3,4,5')return'Weekdays';if(d.join()==='0,6')return'Weekends';
  if(d.length>=5)return'Daily except '+[0,1,2,3,4,5,6].filter(x=>!d.includes(x)).map(x=>DOWN[x]).join(', ');
  return d.map(x=>DOWN[x]).join(' ');
}
function nextOcc(t){ /* next scheduled date after this instance, never in the past */
  const ed=effDays(t);if(!ed.length)return null;const td=ymd(new Date());let d=new Date(t.date+'T00:00:00');
  for(let g=0;g<800;g++){d=addDays(d,1);if(ed.includes(d.getDay())&&ymd(d)>=td)return ymd(d)}return null;
}
function roll(){ /* a repeating task done on an earlier day comes back as a fresh task for its next day */
  const td=ymd(new Date());let ch=false;
  tasks.forEach(t=>{if(t.repeat&&t.done&&t.date<td){const nd=nextOcc(t);if(nd){t.date=nd;t.done=false;delete t.snooze;(t.subs||[]).forEach(x=>x.d=false);t.fired=fireTimes(t).filter(f=>f<=Date.now());ch=true}}});
  if(ch)Store.save(tasks);
}

/* ===== log, stats, history ===== */
const loadLog=()=>jget(LOGKEY,[]);
const saveLog=l=>jset(LOGKEY,l.slice(-2000));
function logDone(t){const L=loadLog();L.push({d:ymd(new Date()),ok:endAt(t).getTime()>=Date.now(),id:t.id});saveLog(L)}
function stats(){
  const L=loadLog(),days=new Set(L.map(x=>x.d));let n=0,d=new Date();
  if(!days.has(ymd(d)))d=addDays(d,-1);
  while(days.has(ymd(d))){n++;d=addDays(d,-1)}
  const w=[...Array(7)].map((_,i)=>{const k=ymd(addDays(new Date(),i-6));return{k,c:L.filter(x=>x.d===k).length}});
  const m=L.filter(x=>x.d>=ymd(addDays(new Date(),-29)));
  return{streak:n,week:w.reduce((a,b)=>a+b.c,0),ok:m.length?Math.round(m.filter(x=>x.ok).length*100/m.length)+'%':'–',w};
}
function repHistory(t){
  const done=new Set(loadLog().filter(x=>x.id===t.id).map(x=>x.d)),ed=effDays(t),now=new Date(),td=ymd(now);
  const start=addDays(now,-now.getDay()-21),first=[...done].sort()[0]||'9999-12-31';let cells='',sch=0,dn=0;
  for(let i=0;i<28;i++){const d=addDays(start,i),k=ymd(d),fut=k>td,sc=ed.includes(d.getDay()),h=done.has(k);
    if(!fut){if(sc&&k>=first&&(k<td||h))sch++;if(h)dn++}
    cells+=`<i class="${h?'d':(!fut&&sc&&k<td&&k>=first)?'m':'n'}${k===td?' t':''}"></i>`}
  let st=0;for(let i=0;i<400;i++){const d=addDays(now,-i),k=ymd(d);if(done.has(k)){st++;continue}if(!ed.includes(d.getDay())||k===td)continue;break}
  return `<div class="stats" style="margin-top:0"><div class="stat"><b>${st}</b><span>Streak</span></div><div class="stat"><b>${dn}</b><span>Done, 4 weeks</span></div><div class="stat"><b>${sch?Math.min(100,Math.round(dn*100/sch)):0}%</b><span>Kept up</span></div></div><div class="hist">`+['S','M','T','W','T','F','S'].map(l=>`<em>${l}</em>`).join('')+cells+`</div>`;
}

/* ===== reminders, morning summary, notifications ===== */
let tasks=Store.load();
const OPTS=[[1440,'1 day before'],[60,'1 hour before'],[10,'10 minutes before'],[0,'At the time']];
const SH={1440:'1 day',60:'1 hour',10:'10 min',0:'At the time'};
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const FS=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem;
function fireTimes(t){const b=baseAt(t),a=(t.rem||[]).map(o=>b-o*60000);if(t.snooze)a.push(t.snooze);return a}
const msgFor=t=>dateTxt(t.date)+(t.start?' · '+timeTxt(t):'');
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%800000000};
let bnTask=null,bnTimer;
function showBanner(t){
  bnTask=t;$('#bn-t').textContent=t.title;$('#bn-s').textContent=msgFor(t);$('#bn-sn').textContent='Snooze '+S.snooze+' min';
  $('#banner').classList.add('show');clearTimeout(bnTimer);bnTimer=setTimeout(hideBanner,9000);buzz([120,60,120]);
  try{if(!LN()&&window.Notification&&Notification.permission==='granted')new Notification(t.title,{body:msgFor(t)})}catch(e){}
}
const hideBanner=()=>$('#banner').classList.remove('show');
function tick(){
  const now=Date.now();let ch=false;
  tasks.forEach(t=>{if(t.done)return;t.fired=t.fired||[];const end=endAt(t).getTime();
    fireTimes(t).forEach(f=>{if(f<=now&&f<end&&f>now-6*36e5&&!t.fired.includes(f)){t.fired.push(f);ch=true;showBanner(t)}})});
  if(ch)Store.save(tasks);
}
function tasksOn(ds){
  const wd=new Date(ds+'T00:00:00').getDay();
  return tasks.filter(t=>t.repeat?((t.date===ds&&!t.done)||(t.date<ds&&effDays(t).includes(wd))):(!t.done&&t.date===ds));
}
function morningList(){
  const out=[],[hh,mm]=(S.morningTime||'07:30').split(':').map(Number),now=Date.now();
  for(let i=0;i<7;i++){
    const d=addDays(new Date(),i);d.setHours(hh,mm,0,0);if(d.getTime()<=now)continue;
    const list=tasksOn(ymd(d)).sort((a,b)=>(a.start||'99:99')<(b.start||'99:99')?-1:1);
    const od=i===0?tasks.filter(t=>!t.done&&endAt(t).getTime()<now).length:0;
    if(!list.length&&!od)continue;
    const first=list.find(t=>t.start);
    out.push({id:900000000+i,title:'Good morning'+(S.name?', '+S.name:''),at:d.getTime(),
      body:(list.length?list.length+(list.length===1?' task today':' tasks today')+(first?' · first: '+first.title+' at '+t12(first.start):''):'')+(od?(list.length?' · ':'')+od+' overdue':'')});
  }
  return out;
}
async function sync(){ /* real Android notifications (Capacitor) */
  const ln=LN();if(!ln)return;
  try{
    const p=await ln.getPending();if(p.notifications.length)await ln.cancel({notifications:p.notifications});
    const now=Date.now(),n=[];
    tasks.forEach(t=>{let u=t;
      if(t.done){if(!t.repeat)return;const nd=nextOcc(t);if(!nd)return;u=Object.assign({},t,{date:nd,snooze:null})}
      fireTimes(u).forEach(f=>{if(f>now)n.push({id:hash(t.id+f),title:t.title,body:msgFor(u),at:f})})});
    if(S.morning)morningList().forEach(x=>n.push(x));
    n.sort((a,b)=>a.at-b.at);
    if(n.length)await ln.schedule({notifications:n.slice(0,60).map(x=>({id:x.id,title:x.title,body:x.body,schedule:{at:new Date(x.at),allowWhileIdle:true}}))});
  }catch(e){}
}
async function askPerm(){
  try{const ln=LN();if(ln)await ln.requestPermissions();else if(window.Notification&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}
}
async function askFsPerm(){try{const f=FS();if(f&&f.requestPermissions)await f.requestPermissions()}catch(e){}}

/* ===== backup ===== */
const backup=()=>JSON.stringify({app:'taskflow',v:6,tasks,log:loadLog(),settings:S},null,1);
async function autoBackup(force){
  const fs=FS();if(!fs)return false;
  const td=ymd(new Date());
  if(!force){if(S.autoBackup==='off')return false;const gap=S.autoBackup==='weekly'?7:1;if(S.lastBackup&&(new Date(td)-new Date(S.lastBackup))/864e5<gap)return false}
  try{
    await fs.writeFile({path:'TaskFlow/taskflow-backup-'+td+'.json',data:backup(),directory:'DOCUMENTS',encoding:'utf8',recursive:true});
    S.lastBackup=td;S.lastBackupErr='';saveS();
    try{const r=await fs.readdir({path:'TaskFlow',directory:'DOCUMENTS'}),names=r.files.map(f=>f.name||f).filter(n=>/^taskflow-backup-.*\.json$/.test(n)).sort();
      for(const n of names.slice(0,-5))await fs.deleteFile({path:'TaskFlow/'+n,directory:'DOCUMENTS'}).catch(()=>{})}catch(e){}
    return true;
  }catch(e){S.lastBackupErr=String((e&&e.message)||e).slice(0,70);saveS();return false}
}
async function restore(f){
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.tasks))throw 0;
    if(confirm('Replace your current tasks with this backup ('+j.tasks.length+' tasks)?')){tasks=j.tasks;Store.save(tasks);saveLog(j.log||[]);
      if(j.settings){S=Object.assign({},DEF,j.settings);S.src=Object.assign({},DEF.src,S.src||{});saveS();applyTheme()}render();renderSettings()}}

/* ===== contests ===== */
const jf=async(u,o)=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),14000);try{const r=await fetch(u,Object.assign({signal:c.signal},o));if(!r.ok)throw new Error('HTTP '+r.status);return r}finally{clearTimeout(tm)}};
const SRC={
  codeforces:{n:'Codeforces',c:'#1f8acb',get:async()=>{const j=await(await jf('https://codeforces.com/api/contest.list?gym=false')).json();
    return j.result.filter(x=>x.phase==='BEFORE').map(x=>({k:'cf'+x.id,p:'codeforces',name:x.name,start:x.startTimeSeconds*1000,dur:x.durationSeconds*1000,link:'https://codeforces.com/contest/'+x.id}))}},

let sw=null,justSwiped=0;
list.addEventListener('click',e=>{
  if(Date.now()-justSwiped<400)return;
  const row=e.target.closest('.trow');if(!row)return;const t=tasks.find(x=>x.id===row.dataset.id);if(!t)return;
  if(e.target.closest('.chk'))toggleDone(t,row);else{curId=t.id;openSheet('details')}

  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)<10)return;
    sw.on=true;sw.row.classList.add('drag');try{sw.row.setPointerCapture(sw.id)}catch(_){}}
  const t=tasks.find(x=>x.id===sw.row.dataset.id);sw.dx=dx;
  sw.row.style.setProperty('--dx',dx+'px');sw.row.dataset.sw=dx>0?'r':'l';sw.row.dataset.lbl=dx>0?(t&&t.done?'Undo':'Done'):'Delete';
});
function endSwipe(){
  if(!sw)return;const{row,dx,on}=sw;sw=null;if(!on)return;
  justSwiped=Date.now();row.classList.remove('drag');row.style.setProperty('--dx','0px');
  const t=tasks.find(x=>x.id===row.dataset.id);

  t.rem=E.rem.slice().sort((a,b)=>b-a);
  const d=E.days.slice().sort();
  if(d.length){t.repeat=d.length===7?'daily':'days';t.days=d.length===7?null:d;let x=new Date(t.date+'T00:00:00');for(let g=0;g<8&&!d.includes(x.getDay());g++)x=addDays(x,1);t.date=ymd(x)}
  else{t.repeat=null;t.days=null}
  delete t.snooze;t.fired=fireTimes(t).filter(f=>f<=Date.now());
  Store.save(tasks);buzz(10);render();closeTop();
});

/* ===== iOS-style wheel pickers ===== */
let pk=null;const IH=36;
function openPick(kind,val,cb,clr){
  const now=new Date(),w=[];
  if(kind==='date'){const[y,m,d]=(val||ymd(now)).split('-').map(Number),cy=now.getFullYear(),yrs=[];for(let i=Math.min(cy-1,y);i<=Math.max(cy+5,y);i++)yrs.push(i);
    pk={kind,cb,yrs};w.push([MON.map(x=>x[0].toUpperCase()+x.slice(1)),m-1],[Array.from({length:31},(_,i)=>i+1),d-1],[yrs,yrs.indexOf(y)])}
  else{const[h,mi]=(val||pad(now.getHours())+':'+pad(Math.floor(now.getMinutes()/5)*5)).split(':').map(Number);pk={kind,cb};
    if(S.h24)w.push([Array.from({length:24},(_,i)=>pad(i)),h],[Array.from({length:60},(_,i)=>pad(i)),mi]);
    else w.push([Array.from({length:12},(_,i)=>i+1),(h%12||12)-1],[Array.from({length:60},(_,i)=>pad(i)),mi],[['AM','PM'],h>=12?1:0])}
  $('#pk-title').textContent=kind==='date'?'Date':'Time';$('#pk-clear').hidden=!clr;
  $('#pk-w').innerHTML=w.map(c=>`<div class="wi"><div class="pad"></div>${c[0].map(x=>`<div class="it">${x}</div>`).join('')}<div class="pad"></div></div>`).join('');
  openSheet('pick');
  const cols=[...document.querySelectorAll('#pk-w .wi')],set=()=>cols.forEach((el,i)=>el.scrollTop=w[i][1]*IH);set();requestAnimationFrame(set);
}
const pkIdx=()=>[...document.querySelectorAll('#pk-w .wi')].map(el=>Math.max(0,Math.min(el.querySelectorAll('.it').length-1,Math.round(el.scrollTop/IH))));
$('#pk-ok').addEventListener('click',()=>{
  const ix=pkIdx();let v;
  if(pk.kind==='date'){const y=pk.yrs[ix[2]],m=ix[0],d=Math.min(ix[1]+1,new Date(y,m+1,0).getDate());v=y+'-'+pad(m+1)+'-'+pad(d)}
  else if(S.h24)v=pad(ix[0])+':'+pad(ix[1]);
  else{let h=ix[0]+1;if(h===12)h=0;if(ix[2]===1)h+=12;v=pad(h)+':'+pad(ix[1])}
  const cb=pk.cb;cb(v);closeTop();buzz(6);
});
$('#pk-clear').addEventListener('click',()=>{const cb=pk.cb;cb(null);closeTop()});

/* ===== contests sheet ===== */
$('#cbtn').addEventListener('click',()=>{openSheet('cont');if(!CT.t||Date.now()-CT.t>6*36e5)refreshContests()});
$('#c-ref').addEventListener('click',refreshContests);
$('#c-list').addEventListener('click',e=>{const b=e.target.closest('.cadd');if(b&&!b.classList.contains('on'))addContest(b.dataset.k)});

/* ===== progress and settings ===== */
function renderProgress(){
  const t=stats(),mx=Math.max(1,...t.w.map(x=>x.c));
  $('#progress').innerHTML=`<div class="stats"><div class="stat"><b>${t.streak}</b><span>Day streak</span></div><div class="stat"><b>${t.week}</b><span>Done this week</span></div><div class="stat"><b>${t.ok}</b><span>On time</span></div></div>
  <div class="bars">${t.w.map(x=>`<div><i style="height:0" data-h="${Math.round(x.c/mx*100)}"></i><em>${new Date(x.k+'T00:00:00').toLocaleDateString('en-IN',{weekday:'narrow'})}</em></div>`).join('')}</div>
  <p class="sm" style="margin:14px 6px">Based on the tasks you complete. Last 7 days shown.</p>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#progress .bars i').forEach(i=>i.style.height=Math.max(4,i.dataset.h)+'%')));
}
const SWATCH=['#007aff','#af52de','#34c759','#ff9500','#ff2d92','#30b0c7'];
const BUILD='__BUILD__';
function renderSettings(){
  const sw=(a,l,on)=>`<div class="srow"><span>${l}</span><label class="sw"><input type="checkbox" ${a} ${on?'checked':''}><i></i></label></div>`;
  const seg=(k,l,o,multi)=>`<div class="srow col"><span>${l}</span><div class="seg${multi?' multi':''}">${o.map(x=>`<button data-k="${k}" data-v="${x[0]}" class="${(multi?S[k].includes(x[0]):S[k]==x[0])?'on':''}">${x[1]}</button>`).join('')}</div></div>`;
  const btn=(a,l,c)=>`<button class="srow btn${c?' '+c:''}" data-act="${a}"><span>${l}</span></button>`;
  const grp=(h,x)=>`<h2>${h}</h2><div class="group">${x}</div>`;
  const k=(n,l)=>sw(`data-k="${n}"`,l,S[n]);
  $('#settings').innerHTML=
    grp('Appearance',seg('theme','Theme',[['auto','Auto'],['dark','Dark'],['light','Light']])+
      `<div class="srow col"><span>Accent color</span><div class="dots">${SWATCH.map(c=>`<button data-k="accent" data-v="${c}" style="--c:${c}" class="${S.accent===c?'on':''}" aria-label="Accent color"></button>`).join('')}</div></div>`+k('anim','Animations')+k('haptics','Haptic feedback'))+
    grp('Reminders',seg('rem','Default reminders for new tasks',OPTS.map(o=>[o[0],SH[o[0]]]),true)+seg('snooze','Snooze length',[[10,'10 min'],[30,'30 min'],[60,'1 hour']])+k('morning','Morning summary')+(S.morning?`<div class="srow"><span>Summary time</span><input class="tin" type="time" data-k="morningTime" value="${S.morningTime}"></div>`:'')+btn('notif','Enable notifications'))+
    grp('Tasks',`<div class="srow"><span>Your name</span><input class="tin" id="s-name" placeholder="Optional" value="${esc(S.name)}"></div>`+k('h24','24-hour time')+seg('ampm','Times like 7:30 with no am/pm',[['contest','PM for contests'],['pm','Always PM'],['am','Always AM']])+k('showDone','Show completed tasks')+k('tags','Priority, tags and filters'))+
    grp('Contest platforms',Object.keys(SRC).map(n=>sw(`data-src="${n}"`,SRC[n].n,S.src[n])).join(''))+
    grp('Data',seg('autoBackup','Automatic backup to your phone',[['off','Off'],['daily','Daily'],['weekly','Weekly']])+btn('bk-now','Back up now')+`<div class="srow"><span style="font-size:13px;color:var(--sub)">${FS()?(S.lastBackup?'Last saved '+S.lastBackup+' in Documents/TaskFlow':'Not saved yet')+(S.lastBackupErr?' · '+esc(S.lastBackupErr):''):'Automatic backup works in the Android app. Here, use Download backup.'}</span></div>`+btn('dl','Download backup')+btn('cp','Copy backup to clipboard')+`<label class="srow btn" for="bk-file"><span>Restore from file…</span></label><input id="bk-file" type="file" accept=".json,application/json" hidden>`+btn('clear','Clear all data','danger'))+
    `<p class="sm" style="margin:14px 6px 0">TaskFlow 3.0 · build ${BUILD.startsWith('__')?'dev':BUILD}</p>`;
}
function act(a,b){
  if(a==='notif')askPerm();
  else if(a==='bk-now'){if(!FS()){act('dl',b);return}askFsPerm().then(()=>autoBackup(true)).then(ok=>{b.firstElementChild.textContent=ok?'Saved ✓':'Could not save';setTimeout(renderSettings,1500)})}
  else if(a==='dl'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([backup()],{type:'application/json'}));l.download='taskflow-backup-'+ymd(new Date())+'.json';l.click()}
  else if(a==='cp'){const sp=b.firstElementChild;navigator.clipboard.writeText(backup()).then(()=>{sp.textContent='Copied ✓';setTimeout(()=>sp.textContent='Copy backup to clipboard',1500)}).catch(()=>prompt('Copy this backup:',backup()))}
  else if(a==='clear'&&confirm('Delete ALL tasks and history? This cannot be undone.')){tasks=[];Store.save(tasks);saveLog([]);render()}
}
$('#settings').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act){act(b.dataset.act,b);return}
  const k=b.dataset.k;if(!k)return;let v=b.dataset.v;
  if(k==='rem'){v=+v;S.rem=S.rem.includes(v)?S.rem.filter(x=>x!==v):S.rem.concat(v).sort((x,y)=>y-x)}
  else S[k]=k==='snooze'?+v:v;
  buzz(8);saveS();applyTheme();renderSettings();
  if(k==='autoBackup'&&v!=='off')askFsPerm().then(()=>autoBackup(true)).then(()=>renderSettings());
});
$('#settings').addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='bk-file'){if(el.files[0])restore(el.files[0]);el.value='';return}
  if(el.dataset.src){S.src[el.dataset.src]=el.checked;saveS();return}
  const k=el.dataset.k;if(!k)return;
  S[k]=el.type==='checkbox'?el.checked:el.value;buzz(8);saveS();applyTheme();setTimeout(sync,0);
  if(k==='morning'){if(S.morning)askPerm();renderSettings()}
  render();
});
$('#settings').addEventListener('input',e=>{if(e.target.id==='s-name'){S.name=e.target.value.slice(0,30);saveS()}});

/* ===== start ===== */
const IS_NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  if(IS_NATIVE){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});if(window.caches)caches.keys().then(k=>k.forEach(x=>caches.delete(x))).catch(()=>{})}
  else navigator.serviceWorker.register('sw.js').catch(()=>{});
}
history.replaceState({tab:'today',stack:[]},'');
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();tick();autoBackup(false);sync()}});
setInterval(render,60000);setInterval(tick,15000);
setTab('today',true);tick();sync();setTimeout(()=>autoBackup(false),4000);

</script>
