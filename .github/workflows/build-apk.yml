name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/android@8 @capacitor/local-notifications@8 @capacitor/filesystem@8
          npm install -D @capacitor/cli@8
      - name: Add Android platform
        run: npx cap add android
      - name: Add Wallet screen-security plugin
        run: |
          D=android/app/src/main/java/com/taskflow/app
          cat > $D/WalletSecure.java <<'EOF'
          package com.taskflow.app;
          import android.view.WindowManager;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "WalletSecure")
          public class WalletSecure extends Plugin {
            @PluginMethod
            public void set(final PluginCall call) {
              final boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
              getActivity().runOnUiThread(new Runnable() {
                public void run() {
                  if (on) getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                  else getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                }
              });
              call.resolve();
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.taskflow.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(WalletSecure.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
      - name: Generate app icon
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('docs/icon-512.png').convert('RGBA')
          R = 'android/app/src/main/res'
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = R + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              ic = src.resize((s, s), Image.LANCZOS)
              ic.save(p + '/ic_launcher.png')
              m = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
              m = m.resize((s, s), Image.LANCZOS)
              r = ic.copy()
              r.putalpha(m)
              r.save(p + '/ic_launcher_round.png')
              f = int(s * 108 / 48)
              inner = int(f * 0.8)
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              fg.paste(src.resize((inner, inner), Image.LANCZOS), ((f - inner) // 2, (f - inner) // 2))
              fg.save(p + '/ic_launcher_foreground.png')
          os.makedirs(R + '/values', exist_ok=True)
          open(R + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#007AFF</color>\n</resources>\n')
          EOF
      - name: Add notification permissions
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Use the permanent signing key and bump version
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/__BUILD__/${{ github.run_number }}/" docs/index.html
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
